services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - internal
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:frog4life@database:5432/postgres
      SECRET_KEY: 3e01bf5381e2c4d794f42e8c23ad8aa268056109f03a5e5582cd5ba105ccc567
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      INITIAL_ADMIN_CREDS: admin:$2b$12$5oM984vTwxqYJJAVigz9F.wVg5ClOpg82/NHTTIILT4o5nnhZlLbq
    depends_on:
      - database
    links:
      - database
    volumes:
      - ./backend:/app
    networks:
      - internal
  database:
    image: postgres:14.11
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=frog4life
    ports:
      - 5432:5432
    volumes:
      - database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - ./tobeinserted.csv:/tobeinserted.csv
    networks:
      - internal
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - 8080:80
    networks:
      - internal

volumes:
  database:


networks:
  internal:
    driver: bridge
