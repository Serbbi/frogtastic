version: "3.8"
services:
  frontend:
    build:
      context: ./frontend # Specify the build context for the React app
      dockerfile: Dockerfile # Specify the Dockerfile for the React app
    ports:
      - 3000:3000
    volumes:
      - type: bind
        source: ./frontend
        target: /app
    working_dir: /app
    develop:
      watch:
        - action: sync # 'build' is another action type
          path: ./frontend # host directory path
          target: /app # container directory path to map
          ignore:
            - frontend/node_modules/
  backend:
    build: ./backend
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: postgresql://postgres:frog4life@database:5432/postgres
      SECRET_KEY: 3e01bf5381e2c4d794f42e8c23ad8aa268056109f03a5e5582cd5ba105ccc567
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - database
    links:
      - database
    volumes:
      - ./backend:/app
  database:
    image: postgres:14.11
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=frog4life
    ports:
      - 5432:5432
    volumes:
      - database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
      - ./tobeinserted.csv:/tobeinserted.csv

volumes:
  database:
