services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    env_file: ./.env
    volumes:
      - ./frontend:/app
    networks:
      - internal
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - 8000:8000
    env_file: ./.env
    depends_on:
      - database
    links:
      - database
    volumes:
      - ./backend:/app
    networks:
      - internal
  database:
    image: postgres:14.11
    restart: always
    env_file: ./.env
    ports:
      - 5432:5432
    volumes:
      - database:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
    networks:
      - internal
  pgadmin:
    image: dpage/pgadmin4
    env_file: ./.env
    ports:
      - 8080:80
    networks:
      - internal

volumes:
  database:


networks:
  internal:
    driver: bridge
